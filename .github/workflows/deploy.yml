name: Production Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Service A image
        run: docker build -t ghcr.io/rafael-martins-a22308006/cloud_project_vicente_rafa/service-a:latest ./semana2/service-a

      - name: Push Service A image
        run: docker push ghcr.io/rafael-martins-a22308006/cloud_project_vicente_rafa/service-a:latest

      - name: Build Service B image
        run: docker build -t ghcr.io/rafael-martins-a22308006/cloud_project_vicente_rafa/service-b:latest ./semana2/service-b

      - name: Push Service B image
        run: docker push ghcr.io/rafael-martins-a22308006/cloud_project_vicente_rafa/service-b:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
        run: terraform apply -auto-approve

      - name: Show Outputs
        working-directory: terraform
        run: terraform output

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Configure SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > cloud-key.pem
          chmod 600 cloud-key.pem

      - name: Generate Ansible inventory
        run: |
          EC2_IP=$(cd terraform && terraform output -raw ec2_public_ip)
          echo "[web]" > ansible/inventory.ini
          echo "$EC2_IP ansible_user=ec2-user ansible_ssh_private_key_file=../cloud-key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.ini
          cat ansible/inventory.ini

      - name: Run Ansible playbook
        working-directory: ansible
        run: ansible-playbook -i inventory.ini playbook.yml